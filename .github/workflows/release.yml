name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Don't waste a build on docs-only changes (README, license, etc.).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Swoosh.apk

      # Always keep the built APK as a downloadable artifact on the workflow run.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swoosh-apk
          path: Swoosh.apk

      # Tag pushes (v1.2.3) -> a proper versioned GitHub Release.
      - name: Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Swoosh.apk

      # Every push to main -> an immutable build-N tag + release, so any older
      # build stays downloadable (workflow artifacts expire, these don't).
      - name: Release (versioned build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: "${{ github.event.head_commit.message }}"
          make_latest: false
          files: Swoosh.apk

      # ...and refresh the rolling "latest" release so users always have one
      # obvious download link. Move the tag first, otherwise the auto-generated
      # "Source code" zip/tar.gz stay frozen at the commit that created the tag.
      - name: Move latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Auto-built from the newest commit on main. Download Swoosh.apk below."
          files: Swoosh.apk
